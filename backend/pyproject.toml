[project]
name = "autonomous-post-training-engineer"
version = "0.1.0"
description = "Backend for an observable Strands-driven autonomous post-training hackathon demo for AWS Agents for Humans."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.133,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.34,<1",
  "strands-agents>=0.1.0,<1",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
cloud = [
  "aws-cdk-lib>=2.140,<3",
  "opentelemetry-exporter-otlp>=1.39,<2",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test_implementation.py", "test_posttraining.py"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
