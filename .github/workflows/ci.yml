name: Backend CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.x"
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra cloud --extra dev

      - name: Run backend tests
        working-directory: backend
        run: uv run python test_implementation.py

      - name: Compile AWS backend
        working-directory: backend
        run: uv run python -m compileall -q app

      - name: Validate living documentation
        if: github.event_name != 'pull_request'
        run: backend/.venv/bin/python backend/scripts/check_docs_sync.py

      - name: Validate living documentation and changelog
        if: github.event_name == 'pull_request'
        run: backend/.venv/bin/python backend/scripts/check_docs_sync.py --base-ref "origin/${{ github.base_ref }}"

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend container
        run: docker build --tag autonomous-post-training-backend:ci backend

      - name: Validate Docker Compose contract
        run: docker compose config --quiet
