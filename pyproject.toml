[project]
name = "posttrain-agent"
version = "0.2.0"
description = "Autonomous post-training engineer: a LangChain deepagents harness running on Backboard (LLM, memory, fallback) with durable SQLite persistence and checkpoint replay."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "deepagents>=0.7.25,<0.8",
  "backboard-sdk>=1.5.19,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "aiosqlite>=0.22",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[project.scripts]
posttrain = "posttrain_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests", "src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
