services:
  coordinator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_ROLE: coordinator
      PORT: "8080"
      STATE_BACKEND: memory
      ARTIFACT_BACKEND: local
      ARTIFACT_ROOT: /data/artifacts
      TARGET_MODEL: ${TARGET_MODEL:-google/functiongemma-270m-it}
      STRANDS_MODEL: ${STRANDS_MODEL:-nvidia.nemotron-super-3-120b}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MAX_EXPERIMENTS: ${MAX_EXPERIMENTS:-2}
      ENVIRONMENT: local
    ports:
      - "8000:8080"
    volumes:
      - demo-artifacts:/data/artifacts
    depends_on:
      research:
        condition: service_healthy
      execution:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  research:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_ROLE: research
      PORT: "8080"
      STATE_BACKEND: memory
      ARTIFACT_BACKEND: local
      ARTIFACT_ROOT: /data/artifacts
      TARGET_MODEL: ${TARGET_MODEL:-google/functiongemma-270m-it}
      STRANDS_MODEL: ${STRANDS_MODEL:-nvidia.nemotron-super-3-120b}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ENVIRONMENT: local
    ports:
      - "8001:8080"
    volumes:
      - demo-artifacts:/data/artifacts
    healthcheck: &agent-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/.well-known/agent-card.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  execution:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_ROLE: execution
      PORT: "8080"
      STATE_BACKEND: memory
      ARTIFACT_BACKEND: local
      ARTIFACT_ROOT: /data/artifacts
      TARGET_MODEL: ${TARGET_MODEL:-google/functiongemma-270m-it}
      STRANDS_MODEL: ${STRANDS_MODEL:-nvidia.nemotron-super-3-120b}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ENVIRONMENT: local
    ports:
      - "8002:8080"
    volumes:
      - demo-artifacts:/data/artifacts
    healthcheck: *agent-healthcheck

volumes:
  demo-artifacts:
