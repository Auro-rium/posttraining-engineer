# Live dashboard backend: read-only API over the run journal, optionally published through a
# Cloudflare tunnel. `docker compose up` starts the api only. See README "Live dashboard".
#   named tunnel:  docker compose --profile tunnel up   (needs TUNNEL_TOKEN)
#   quick tunnel:  docker compose --profile quick up    (temporary trycloudflare.com URL)
services:
  api:
    build: .
    command: ["posttrain-api"]  # uvicorn entry point of posttrain_agent.api
    # Run as the host user so the API can open the host-owned state files. bash's UID is not
    # exported: `export UID GID=$(id -g)` first, or set them in .env (defaults to 1000:1000).
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      READ_TOKEN: ${READ_TOKEN:?set READ_TOKEN in .env}  # required, also in replay mode
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      STATE_DIR: /state
      REPLAY_FILE: ${REPLAY_FILE:-}  # e.g. /replay/sample-run.jsonl
    volumes:
      # Read-write on purpose: a WAL reader needs a writable -shm file. The API opens the journal
      # read-only and never writes events.
      - ./state:/state
      - ./web/public:/replay:ro
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/v1/health', timeout=4)"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # cloudflared is left on `latest` (no tag pinned that I could verify); pin it for production.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # Not `:?`-required: compose interpolates inactive profiles too, so that would break the
      # default `docker compose up`. cloudflared exits with an error if this is empty.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        # service_started, not service_healthy: the API itself returns 503 to clients until the
        # first run writes the journal, so it would never be healthy on a fresh checkout.
        condition: service_started
    restart: unless-stopped

  tunnel-quick:
    profiles: ["quick"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://api:8787
    depends_on:
      api:
        # see tunnel: the API returns 503 to clients until the first run writes the journal.
        condition: service_started
    restart: unless-stopped
